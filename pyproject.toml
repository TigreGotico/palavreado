[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palavreado"
dynamic = ["version"]
description = "Dead-simple keyword-based intent parser"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasai", email = "jarbasai@mailfence.com" }]
keywords = ["intent", "nlp", "voice", "ovos", "mycroft", "keyword"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["simplematch", "quebra_frases"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/TigreGotico/palavreado"

[tool.hatch.version]
path = "palavreado/version.py"
